<!DOCTYPE html>
<html lang="en">
<head>
    <style>
* {
    box-sizing: border-box
}
.main-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px; 
    max-width: 1200px;
    margin: 0 auto;
    padding: 16px;
}
@media (min-width: 768px) {
    .main-layout {
        grid-template-columns: 2fr 3fr; 
    }
}
.slideshow-container {
    max-width: 100%; 
    position: relative;
    margin: auto;
    border-radius: 8px; 
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
.mySlides {
    display: none;
    position: relative;
}
.mySlides img {
    display: block; 
}
.prev, .next {
    cursor: pointer;
    position: absolute;
    top: 50%;
    width: auto;
    margin-top: -22px;
    padding: 16px;
    color: white;
    font-weight: bold;
    font-size: 18px;
    transition: 0.6s ease;
    border-radius: 0 3px 3px 0;
    user-select: none;
    background-color: rgba(0,0,0,0.5); 
    z-index: 10;
}
.next {
    right: 0;
    border-radius: 3px 0 0 3px;
}
.prev:hover, .next:hover {
    background-color: rgba(0,0,0,0.8);
}
.text {
    color: #fff;
    font-size: 16px;
    padding: 10px 12px;
    position: absolute;
    bottom: 0;
    width: 100%;
    text-align: center;
    background-color: rgba(0,0,0,0.6);
}
.numbertext {
    color: #f2f2f2;
    font-size: 12px;
    padding: 8px 12px;
    position: absolute;
    top: 0;
    left: 0;
    background-color: rgba(0,0,0,0.4);
    border-radius: 0 0 8px 0;
    z-index: 10;
}
.dot {
    cursor: pointer;
    height: 12px;
    width: 12px;
    margin: 0 4px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
    transition: background-color 0.6s ease;
}
.active, .dot:hover {
    background-color: #333;
}

.fade {
    animation-name: fade;
    animation-duration: 1.5s;
}
@keyframes fade {
    from {opacity: .4}
    to {opacity: 1}
}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./Assets/img/logo.jpg" type="image/x-icon">
    <title>Trang chủ</title>
</head>
<body>
    <header>
        <img src="./Assets/img/header_logo.jpg" alt="" id="logo">
        <nav>
        <ul>
            <li><a href="trangchu.html">Trang chủ</a></li>
            <li><a href="gioithieu.html">Giới thiệu</a></li>
            <li><a href="sanpham.html">Sản phẩm</a></li>
            <li><a href="giohang.html">Giỏ hàng</a></li>
            <li><a href="dangnhap.html">Đăng nhập</a></li>
            <li><a href="dangky.html">Đăng ký</a></li>
            <li><a href="lienhe.html">Liên hệ</a></li>
        </ul>
        </nav>
        <section id="searchBox">
            <input type="text" name="" id="searchInput">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button id="cartBtn"><i class="fa-solid fa-shopping-cart"></i></button>
        </section>
    </header>
<main>
 <main class="main-layout mt-8">
    <section class="slideshow-column">
        <div class="slideshow-container">
            <div class="mySlides fade">
                <div class="numbertext">1 / 3</div>
                <img src="https://www.ctu.edu.vn/images/branding/logo/CTU_logo.png" style="width:100%">
                <div class="text">Giới thiệu sản phẩm mới</div>
            </div>
            <div class="mySlides fade">
                <div class="numbertext">2 / 3</div>
                <img src="https://www.ctu.edu.vn/images/branding/logo/CTU_logo.png" style="width:100%">
                <div class="text">Ưu đãi mùa hè</div>
            </div>
            <div class="mySlides fade">
                <div class="numbertext">3 / 3</div>
                <img src="https://www.ctu.edu.vn/images/branding/logo/CTU_logo.png" style="width:100%">
                <div class="text">Đăng ký thành viên</div>
            </div>
            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>
        <div style="text-align:center">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
        </div>
    </section>
    <section class="content-column bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-3xl font-bold mb-4 text-gray-800 border-b pb-2">Sản phẩm nổi bật</h1>
        <div class="grid grid-cols-2 gap-4">
            <div class="p-3 border rounded-md hover:shadow-md transition duration-300">
                <h2 class="font-semibold text-lg text-blue-600">Sản phẩm A</h2>
                <p class="text-sm text-gray-500">Giá:... VNĐ</p>
            </div>
            <div class="p-3 border rounded-md hover:shadow-md transition duration-300">
                <h2 class="font-semibold text-lg text-blue-600">Sản phẩm B</h2>
                <p class="text-sm text-gray-500">Giá:... VNĐ</p>
            </div>
        </div>
    </section>
</main>
<script>
    let slideIndex = 1;
    showSlides(slideIndex);

    function plusSlides(n) {
        showSlides(slideIndex += n);
    }

    function currentSlide(n) {
        showSlides(slideIndex = n);
    }
    function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");
        if (n > slides.length) {slideIndex = 1}    
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";  
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        if (slides[slideIndex-1]) {
            slides[slideIndex-1].style.display = "block";  
        }
        if (dots[slideIndex-1]) {
            dots[slideIndex-1].className += " active";
        }
    }
</script>
</main>
<footer>
    <p>Sản phẩm phục vụ đồ án</p>
    <a id="top" href="#">Về đầu trang</a>
</footer>
